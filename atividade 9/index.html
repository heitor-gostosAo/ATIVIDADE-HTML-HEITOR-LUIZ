<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <!--Faz o cabeçario inicial 'Dados pessoais'-->
    <form action="#" method="post">
        <fieldset>
            <legend>Dados pessoais</legend>
            <!--adiciona o espaço 'Nome' e o que ele lê-->
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"><br><br>
            <!--SEMELHANTE AO ANTERIOR-->
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco"><br><br>
            <!--SEMELHANTE AO ANTERIOR-->
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade"><br><br>
            <!--Gera opções de Estados selecionáveis-->
            <label for="estado">Estado:</label>
            <select id="estado" name="estado">
                <option value="sp">São Paulo</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="pi">Piauí</option>
            </select>
        </fieldset>
        
        <br>
        
        <fieldset>
            <legend>Dados profissionais</legend>
            
            <p>Natureza do Cargo</p>
            <!--Gera um formato com opções selecionáveis -->
            <input type="radio" id="gerencia" name="cargo" value="gerencia" checked>
            <label for="gerencia">Gerência</label>
            <!--Complementa o anterior servindo como opção-->
            <input type="radio" id="financeiro" name="cargo" value="financeiro">
            <label for="financeiro">Financeiro</label>
<!--Complementa o anterior servindo como opção-->
            <input type="radio" id="recepcao" name="cargo" value="recepcao">
            <label for="recepcao">Recepção</label>
<!--Complementa o anterior servindo como opção-->
            <input type="radio" id="administrativo" name="cargo" value="administrativo">
            <label for="administrativo">Administrativo</label>
<!--Complementa o anterior servindo como opção-->
            <input type="radio" id="juridico" name="cargo" value="juridico">
            <label for="juridico">Jurídico</label><br><br>
             <!--Gera um formato com opções selecionáveis, simuntaneamente -->
            <p>Área de interesse</p>
            <input type="checkbox" id="computacao" name="interesse" value="computacao">
            <label for="computacao">Computação</label>
            <input type="checkbox" id="biologia" name="interesse" value="biologia">
            <label for="biologia">Biologia</label>
            <input type="checkbox" id="meio_ambiente" name="interesse" value="meio_ambiente">
            <label for="meio_ambiente">Meio Ambiente</label>
            <input type="checkbox" id="engenharia" name="interesse" value="engenharia">
            <label for="engenharia">Engenharia</label>
            <input type="checkbox" id="historia" name="interesse" value="historia">
            <label for="historia">História</label><br><br>
             <!--Forma um espaço pra escrever algo(currículo)-->
            <label for="curriculo">Mini-currículo:</label><br>
            <textarea id="curriculo" name="curriculo" rows="5" cols="40"></textarea>
        </fieldset>
        
        <br>
         <!--Cria e da função aos botões enviar e limpar-->
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
